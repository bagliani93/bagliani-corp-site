<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Documentos e planilhas entram em um sistema central e saem como relatórios, avisos e agendamentos automáticos">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121A45"/><stop offset="1" stop-color="#070B22"/></linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#3A4A96" stroke-opacity=".28"/></pattern>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#157DD1" stop-opacity=".4"/><stop offset="1" stop-color="#157DD1" stop-opacity="0"/></radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="800" height="450" fill="#0B1234"/>
<rect width="800" height="450" fill="url(#grid)"/>
<ellipse cx="400" cy="225" rx="230" ry="170" fill="url(#glow)"/>

<!-- entrada: documentos e planilhas -->
<g transform="translate(60 62)">
  <rect x="26" y="-22" width="104" height="128" rx="8" fill="#0D1538" stroke="#3F9CE9" stroke-opacity=".3"/>
  <rect x="13" y="-11" width="104" height="128" rx="8" fill="#0D1538" stroke="#3F9CE9" stroke-opacity=".5"/>
  <rect x="0" y="0" width="104" height="128" rx="8" fill="#101A48" stroke="#3F9CE9" stroke-width="1.5"/>
  <g stroke="#3F9CE9" stroke-opacity=".45"><path d="M14 22H90M14 40H90M14 58H90M14 76H90M14 94H90M14 112H90"/><path d="M14 22V112M40 22V112M66 22V112M90 22V112"/></g>
  <rect x="15" y="41" width="24" height="16" fill="#F2903D" opacity=".9"/>
  <rect x="67" y="77" width="22" height="16" fill="#3F9CE9" opacity=".8"/>
  <rect x="41" y="95" width="24" height="16" fill="#3F9CE9" opacity=".5"/>
</g>

<!-- pessoa à mesa, cuidando dos documentos -->
<g>
  <path d="M84 352V336C84 308 112 294 152 292C192 294 220 308 220 336V352Z" fill="#172052"/>
  <path d="M104 318C116 302 132 296 152 294C172 296 188 302 200 318" fill="none" stroke="#3F9CE9" stroke-opacity=".45" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M138 302C144 310 160 310 166 302" fill="none" stroke="#F2903D" stroke-width="3" stroke-linecap="round"/>
  <rect x="140" y="282" width="24" height="18" fill="#172052"/>
  <circle cx="152" cy="262" r="28" fill="#1A2460"/>
  <path d="M128 254A28 28 0 0 1 176 254" fill="none" stroke="#3F9CE9" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- mesa e notebook (visto por trás) -->
  <rect x="56" y="350" width="194" height="8" rx="4" fill="#1E2860"/>
  <path d="M122 350V326a4 4 0 0 1 4-4h52a4 4 0 0 1 4 4v24z" fill="#0F1740" stroke="#3F9CE9" stroke-width="1.5"/>
  <circle cx="152" cy="337" r="3.5" fill="#F2903D"/>
  <rect x="114" y="348" width="76" height="6" rx="3" fill="#1E2860" stroke="#3F9CE9" stroke-opacity=".6" stroke-width="1.5"/>
</g>

<!-- fluxo de entrada: do notebook e dos documentos para o sistema -->
<path d="M184 334C252 334 284 240 336 228" fill="none" stroke="#3F9CE9" stroke-opacity=".55" stroke-width="2" stroke-dasharray="5 8"/>
<path d="M168 128C240 128 282 200 336 222" fill="none" stroke="#3F9CE9" stroke-opacity=".4" stroke-width="2" stroke-dasharray="5 8"/>
<circle cx="252" cy="310" r="4" fill="#F2903D"/><circle cx="300" cy="246" r="3" fill="#F2903D"/><circle cx="246" cy="146" r="3" fill="#F2903D"/>

<!-- sistema central -->
<g transform="translate(400 225)">
  <circle r="74" fill="#3F9CE9" opacity=".25" filter="url(#blur)"/>
  <circle r="92" fill="none" stroke="#3F9CE9" stroke-opacity=".3" stroke-dasharray="3 10"/>
  <path d="M0-58 50-29v58L0 58-50 29v-58z" fill="#0B1234" stroke="#3F9CE9" stroke-width="2"/>
  <path d="M0-36 31-18v36L0 36-31 18v-36z" fill="#CF670B"/>
  <path d="M-13 2l9 9 18-20" fill="none" stroke="#060A1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="92" cy="0" r="4" fill="#F2903D"/><circle cx="-65" cy="-65" r="3" fill="#3F9CE9"/><circle cx="60" cy="70" r="3" fill="#3F9CE9"/>
</g>

<!-- fluxo de saída -->
<g fill="none" stroke="#3F9CE9" stroke-opacity=".55" stroke-width="2" stroke-dasharray="5 8">
  <path d="M466 220C520 215 540 110 598 110"/>
  <path d="M470 225H598"/>
  <path d="M466 230C520 235 540 340 598 340"/>
</g>
<circle cx="540" cy="142" r="3.5" fill="#F2903D"/><circle cx="536" cy="225" r="3.5" fill="#F2903D"/><circle cx="545" cy="312" r="3.5" fill="#F2903D"/>

<!-- saída 1: relatório -->
<g transform="translate(600 70)">
  <rect width="150" height="80" rx="10" fill="#101A48" stroke="#3F9CE9" stroke-width="1.5"/>
  <rect x="16" y="14" width="56" height="6" rx="3" fill="#3A4A96"/>
  <rect x="16" y="46" width="12" height="20" rx="2" fill="#3F9CE9"/>
  <rect x="36" y="38" width="12" height="28" rx="2" fill="#3F9CE9"/>
  <rect x="56" y="42" width="12" height="24" rx="2" fill="#3F9CE9"/>
  <rect x="76" y="30" width="12" height="36" rx="2" fill="#3F9CE9"/>
  <rect x="96" y="20" width="12" height="46" rx="2" fill="#F2903D"/>
  <path d="M116 44h18M116 54h12" stroke="#3A4A96" stroke-width="3" stroke-linecap="round"/>
</g>
<!-- saída 2: aviso / e-mail -->
<g transform="translate(600 185)">
  <rect width="150" height="80" rx="10" fill="#101A48" stroke="#3F9CE9" stroke-width="1.5"/>
  <rect x="18" y="24" width="50" height="34" rx="5" fill="none" stroke="#3F9CE9" stroke-width="2"/>
  <path d="M18 30l25 16 25-16" fill="none" stroke="#3F9CE9" stroke-width="2"/>
  <circle cx="68" cy="24" r="7" fill="#F2903D"/>
  <rect x="84" y="28" width="50" height="6" rx="3" fill="#3A4A96"/>
  <rect x="84" y="44" width="34" height="6" rx="3" fill="#3A4A96"/>
</g>
<!-- saída 3: agendamento / prazo -->
<g transform="translate(600 300)">
  <rect width="150" height="80" rx="10" fill="#101A48" stroke="#3F9CE9" stroke-width="1.5"/>
  <circle cx="42" cy="40" r="20" fill="none" stroke="#3F9CE9" stroke-width="2"/>
  <path d="M42 28v12l8 6" fill="none" stroke="#F2903D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="84" y="24" width="50" height="6" rx="3" fill="#3A4A96"/>
  <rect x="84" y="40" width="34" height="6" rx="3" fill="#3A4A96"/>
  <path d="M86 60l5 5 11-11" fill="none" stroke="#F2903D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
