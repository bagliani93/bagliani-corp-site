<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 768" width="960" height="768" role="img" aria-label="Pessoa diante de um monitor com um sistema de gestão; gráficos holográficos se projetam acima da tela">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1540"/><stop offset="1" stop-color="#060A1C"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3A4A96" stroke-opacity=".22"/></pattern>
  <radialGradient id="screenGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3F9CE9" stop-opacity=".42"/><stop offset="1" stop-color="#3F9CE9" stop-opacity="0"/></radialGradient>
  <linearGradient id="cone" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3F9CE9" stop-opacity=".3"/><stop offset="1" stop-color="#3F9CE9" stop-opacity="0"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121C50"/><stop offset="1" stop-color="#0A1234"/></linearGradient>
  <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3F9CE9" stop-opacity=".5"/><stop offset="1" stop-color="#3F9CE9" stop-opacity="0"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#172052"/><stop offset="1" stop-color="#060A1C"/></linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141C4A"/><stop offset="1" stop-color="#0A1030"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>

<rect width="960" height="768" fill="#0B1234"/>
<rect width="960" height="768" fill="url(#grid)"/>

<!-- luz da tela -->
<ellipse cx="480" cy="380" rx="380" ry="270" fill="url(#screenGlow)"/>
<!-- cone holográfico projetado para cima -->
<polygon points="296,250 664,250 790,36 170,36" fill="url(#cone)"/>
<!-- feixes de dados subindo -->
<g stroke="#3F9CE9" stroke-opacity=".4" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round">
  <path d="M372 244V120"/><path d="M590 244V100"/><path d="M500 244V60"/>
</g>

<!-- mesa -->
<rect x="40" y="586" width="880" height="12" rx="6" fill="#1C265E"/>
<rect x="40" y="598" width="880" height="70" fill="url(#desk)"/>

<!-- monitor -->
<rect x="462" y="520" width="36" height="48" fill="#1B2458"/>
<rect x="388" y="562" width="184" height="14" rx="7" fill="#1E2860"/>
<rect x="246" y="244" width="468" height="282" rx="16" fill="#0B1234" stroke="#3F9CE9" stroke-opacity=".75" stroke-width="2"/>
<rect x="258" y="256" width="444" height="258" rx="10" fill="url(#screen)"/>

<!-- interface do sistema na tela -->
<rect x="270" y="268" width="72" height="234" rx="8" fill="#0F1740"/>
<rect x="282" y="282" width="48" height="8" rx="4" fill="#F2903D"/>
<rect x="282" y="302" width="48" height="6" rx="3" fill="#3A4A96"/>
<rect x="282" y="316" width="34" height="6" rx="3" fill="#3A4A96"/>
<rect x="282" y="330" width="44" height="6" rx="3" fill="#3A4A96"/>
<rect x="282" y="344" width="28" height="6" rx="3" fill="#3A4A96"/>
<rect x="282" y="358" width="40" height="6" rx="3" fill="#3A4A96"/>

<g>
  <rect x="356" y="268" width="106" height="52" rx="8" fill="#121C4C" stroke="#3F9CE9" stroke-opacity=".35"/>
  <rect x="366" y="278" width="40" height="5" rx="2.5" fill="#3A4A96"/>
  <rect x="366" y="296" width="66" height="10" rx="3" fill="#3F9CE9"/>
  <rect x="470" y="268" width="106" height="52" rx="8" fill="#121C4C" stroke="#3F9CE9" stroke-opacity=".35"/>
  <rect x="480" y="278" width="40" height="5" rx="2.5" fill="#3A4A96"/>
  <rect x="480" y="296" width="48" height="10" rx="3" fill="#F2903D"/>
  <rect x="584" y="268" width="106" height="52" rx="8" fill="#121C4C" stroke="#3F9CE9" stroke-opacity=".35"/>
  <rect x="594" y="278" width="40" height="5" rx="2.5" fill="#3A4A96"/>
  <rect x="594" y="296" width="80" height="10" rx="3" fill="#3F9CE9"/>
</g>

<rect x="356" y="332" width="334" height="92" rx="8" fill="#101A48"/>
<g stroke="#3A4A96" stroke-opacity=".5"><path d="M368 356H678M368 380H678M368 404H678"/></g>
<path d="M368 408 410 392 452 398 494 376 536 380 578 356 620 362 662 342 662 416 368 416Z" fill="url(#chartFill)"/>
<path d="M368 408 410 392 452 398 494 376 536 380 578 356 620 362 662 342" fill="none" stroke="#3F9CE9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="662" cy="342" r="5" fill="#F2903D"/>

<g fill="#3A4A96">
  <rect x="356" y="438" width="334" height="8" rx="4" opacity=".9"/>
  <rect x="356" y="456" width="300" height="8" rx="4" opacity=".7"/>
  <rect x="356" y="474" width="318" height="8" rx="4" opacity=".55"/>
  <rect x="356" y="492" width="260" height="8" rx="4" opacity=".4"/>
</g>
<rect x="676" y="456" width="14" height="8" rx="4" fill="#F2903D"/>
<rect x="662" y="492" width="28" height="8" rx="4" fill="#3F9CE9"/>

<!-- hologramas -->
<g transform="translate(430 142)">
  <circle r="64" fill="#3F9CE9" opacity=".28" filter="url(#blur)"/>
  <circle r="46" fill="none" stroke="#3F9CE9" stroke-opacity=".35" stroke-width="12"/>
  <circle r="46" fill="none" stroke="#F2903D" stroke-width="12" stroke-dasharray="190 289" stroke-linecap="round" transform="rotate(-90)"/>
  <circle r="22" fill="#0B1234" fill-opacity=".55" stroke="#3F9CE9" stroke-opacity=".5"/>
  <circle r="4" fill="#F2903D"/>
</g>

<g stroke="#3F9CE9" stroke-opacity=".6" stroke-width="1.5" fill="#3F9CE9">
  <path d="M236 128 290 100M236 128 300 170M290 100 300 170M300 170 252 204M300 170 350 196" fill="none"/>
  <circle cx="236" cy="128" r="6"/><circle cx="290" cy="100" r="5"/><circle cx="300" cy="170" r="8" fill="#F2903D"/><circle cx="252" cy="204" r="4"/><circle cx="350" cy="196" r="4"/>
</g>

<g fill="#3F9CE9">
  <circle cx="330" cy="70" r="2.5" opacity=".8"/><circle cx="620" cy="52" r="2" opacity=".7"/><circle cx="690" cy="140" r="2.5" opacity=".6"/>
  <circle cx="560" cy="190" r="2" opacity=".7"/><circle cx="400" cy="226" r="2" opacity=".5"/><circle cx="660" cy="214" r="2" opacity=".5"/>
  <circle cx="212" cy="80" r="2" opacity=".5"/><circle cx="740" cy="90" r="2" opacity=".5"/>
</g>
<g fill="#F2903D"><circle cx="520" cy="96" r="3" opacity=".9"/><circle cx="640" cy="170" r="2.5" opacity=".8"/><circle cx="280" cy="60" r="2.5" opacity=".8"/></g>

<!-- pessoa de costas, diante do monitor -->
<g>
  <!-- encosto da cadeira -->
  <rect x="356" y="672" width="248" height="120" rx="40" fill="#0B1234" stroke="#3F9CE9" stroke-opacity=".3" stroke-width="2"/>
  <!-- ombros e tronco -->
  <path d="M312 768V720C312 680 356 656 414 650H546C604 656 648 680 648 720V768Z" fill="url(#body)"/>
  <path d="M336 702C358 672 390 658 424 654H536C570 658 602 672 624 702" fill="none" stroke="#3F9CE9" stroke-opacity=".4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- gola -->
  <path d="M448 652C460 664 500 664 512 652" fill="none" stroke="#F2903D" stroke-opacity=".9" stroke-width="3" stroke-linecap="round"/>
  <!-- pescoço e cabeça -->
  <rect x="460" y="640" width="40" height="30" fill="#0C1336"/>
  <circle cx="480" cy="600" r="54" fill="url(#body)"/>
  <path d="M432 586A54 54 0 0 1 528 586" fill="none" stroke="#3F9CE9" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
  <!-- luz quente vinda da direita -->
  <path d="M528 586A54 54 0 0 1 526 626" fill="none" stroke="#F2903D" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  <path d="M546 652C604 658 648 680 648 720" fill="none" stroke="#F2903D" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>
