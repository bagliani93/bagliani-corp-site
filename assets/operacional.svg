<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Estoque, apontamento pelo celular e expedição conectados a um mesmo sistema em tempo real">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121A45"/><stop offset="1" stop-color="#070B22"/></linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#3A4A96" stroke-opacity=".28"/></pattern>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#157DD1" stop-opacity=".4"/><stop offset="1" stop-color="#157DD1" stop-opacity="0"/></radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="800" height="450" fill="#0B1234"/>
<rect width="800" height="450" fill="url(#grid)"/>
<ellipse cx="400" cy="210" rx="240" ry="160" fill="url(#glow)"/>

<!-- piso -->
<path d="M40 362H760" stroke="#2A3675" stroke-width="2" stroke-linecap="round"/>

<!-- sistema central (ponto de conexão) -->
<g transform="translate(400 54)">
  <circle r="30" fill="#3F9CE9" opacity=".3" filter="url(#blur)"/>
  <path d="M-36 0a36 36 0 0 1 72 0" fill="none" stroke="#3F9CE9" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
  <path d="M-22 0a22 22 0 0 1 44 0" fill="none" stroke="#3F9CE9" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
  <circle r="9" fill="#CF670B"/>
</g>
<g fill="none" stroke="#3F9CE9" stroke-opacity=".5" stroke-width="2" stroke-dasharray="5 8">
  <path d="M400 64C300 64 220 76 172 110"/>
  <path d="M400 64C400 92 412 130 416 166"/>
  <path d="M400 64C520 64 590 150 630 236"/>
</g>
<circle cx="290" cy="70" r="3.5" fill="#F2903D"/><circle cx="406" cy="92" r="3.5" fill="#F2903D"/><circle cx="548" cy="112" r="3.5" fill="#F2903D"/>

<!-- estoque: prateleira com caixas -->
<g>
  <rect x="66" y="108" width="8" height="254" fill="#1E2860"/>
  <rect x="270" y="108" width="8" height="254" fill="#1E2860"/>
  <rect x="62" y="176" width="220" height="6" rx="3" fill="#3F9CE9" fill-opacity=".55"/>
  <rect x="62" y="248" width="220" height="6" rx="3" fill="#3F9CE9" fill-opacity=".55"/>
  <rect x="62" y="320" width="220" height="6" rx="3" fill="#3F9CE9" fill-opacity=".55"/>
  <g fill="#0D1538" stroke="#3F9CE9" stroke-width="1.5">
    <rect x="86" y="126" width="52" height="48" rx="4"/><rect x="146" y="126" width="52" height="48" rx="4"/><rect x="206" y="126" width="52" height="48" rx="4"/>
    <rect x="86" y="198" width="52" height="48" rx="4" fill="#CF670B" stroke="#F2903D"/><rect x="160" y="198" width="52" height="48" rx="4"/>
    <rect x="86" y="270" width="52" height="48" rx="4"/><rect x="146" y="270" width="52" height="48" rx="4"/><rect x="206" y="270" width="52" height="48" rx="4" fill="#CF670B" stroke="#F2903D"/>
  </g>
  <g stroke="#3F9CE9" stroke-opacity=".5"><path d="M112 126v48M172 126v48M232 126v48M186 198v48M112 270v48M172 270v48"/></g>
  <g stroke="#060A1C" stroke-opacity=".6"><path d="M112 198v48M232 270v48"/></g>
</g>

<!-- operador com o celular na mão -->
<g>
  <rect x="306" y="276" width="18" height="86" rx="6" fill="#141C4A"/>
  <rect x="330" y="276" width="18" height="86" rx="6" fill="#141C4A"/>
  <path d="M296 282V214C296 196 310 184 327 184C344 184 358 196 358 214V282Z" fill="#1A2460"/>
  <rect x="296" y="222" width="62" height="14" fill="#CF670B"/>
  <rect x="296" y="248" width="62" height="6" fill="#F2903D" opacity=".8"/>
  <path d="M304 200C310 190 318 186 327 185C336 186 344 190 350 200" fill="none" stroke="#3F9CE9" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
  <rect x="319" y="168" width="16" height="20" fill="#1A2460"/>
  <circle cx="327" cy="152" r="20" fill="#1A2460"/>
  <path d="M309 146A20 20 0 0 1 345 146" fill="none" stroke="#3F9CE9" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M310 140h34" stroke="#F2903D" stroke-width="5" stroke-linecap="round"/>
  <!-- braço segurando o celular -->
  <path d="M354 212C366 216 376 226 384 238" fill="none" stroke="#1A2460" stroke-width="16" stroke-linecap="round"/>
</g>

<!-- apontamento pelo celular -->
<g transform="translate(374 170) scale(.82)">
  <rect x="-8" y="-8" width="118" height="190" rx="18" fill="#3F9CE9" opacity=".18" filter="url(#blur)"/>
  <rect width="102" height="174" rx="14" fill="#0B1234" stroke="#3F9CE9" stroke-width="2"/>
  <rect x="9" y="12" width="84" height="150" rx="8" fill="#101A48"/>
  <rect x="39" y="5" width="24" height="4" rx="2" fill="#1E2860"/>
  <rect x="17" y="24" width="48" height="6" rx="3" fill="#3A4A96"/>
  <rect x="17" y="40" width="68" height="11" rx="4" fill="#15204F"/><rect x="21" y="43" width="26" height="5" rx="2.5" fill="#3F9CE9"/>
  <rect x="17" y="56" width="68" height="11" rx="4" fill="#15204F"/><rect x="21" y="59" width="38" height="5" rx="2.5" fill="#3F9CE9"/>
  <rect x="17" y="72" width="68" height="11" rx="4" fill="#15204F"/><rect x="21" y="75" width="18" height="5" rx="2.5" fill="#F2903D"/>
  <rect x="17" y="88" width="68" height="11" rx="4" fill="#15204F"/><rect x="21" y="91" width="32" height="5" rx="2.5" fill="#3F9CE9"/>
  <circle cx="51" cy="130" r="19" fill="#CF670B"/>
  <path d="M41.5 130l7 7 13-15" fill="none" stroke="#060A1C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- expedição: caminhão -->
<g transform="translate(540 232)">
  <path d="M-34 56h22M-46 78h30" stroke="#3F9CE9" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="0" y="20" width="150" height="90" rx="6" fill="#101A48" stroke="#3F9CE9" stroke-width="1.5"/>
  <path d="M150 46h40l28 30v34h-68z" fill="#0D1538" stroke="#3F9CE9" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M160 52h22v20h-22z" fill="#3F9CE9" opacity=".55"/>
  <g fill="none" stroke="#3F9CE9" stroke-opacity=".55" stroke-width="1.5">
    <rect x="18" y="44" width="34" height="34" rx="3"/><rect x="60" y="44" width="34" height="34" rx="3"/><rect x="102" y="44" width="34" height="34" rx="3"/>
  </g>
  <rect x="60" y="44" width="34" height="34" rx="3" fill="#CF670B" stroke="#F2903D"/>
  <circle cx="40" cy="112" r="17" fill="#060A1C" stroke="#3F9CE9" stroke-width="3"/><circle cx="40" cy="112" r="5" fill="#F2903D"/>
  <circle cx="180" cy="112" r="17" fill="#060A1C" stroke="#3F9CE9" stroke-width="3"/><circle cx="180" cy="112" r="5" fill="#F2903D"/>
</g>
</svg>
