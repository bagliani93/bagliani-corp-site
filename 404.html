<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Bagliani Corp</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>@font-face{font-family:"Geist";src:url("assets/fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}</style>
<style>
/* Sistema visual conforme a skill landing-page-design (elayadesign/ai-design-skills):
   uma única fonte (Geist), escala tipográfica do Tailwind, espaçamentos da tabela B2,
   raios do Tailwind, fundos planos, ícones Phosphor, curva de movimento B7.
   Cores de fundo: azul-marinho da marca (pedido explícito do cliente, que prevalece sobre a lista B4). */
:root{
  color-scheme:dark;
  --bg:#060A1C;--bg-2:#0A1028;--bg-3:#0F1637;
  --line:rgba(150,160,230,.16);--line-strong:rgba(150,160,230,.32);
  --fg:#ECEFFB;--fg-2:#B4BAD9;--fg-3:#8089B3;
  --orange:#CF670B;--orange-2:#F2903D;--blue:#157DD1;--blue-2:#3F9CE9;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --s-25:2px;--s-50:4px;--s-75:8px;--s-100:12px;--s-200:16px;--s-300:24px;--s-400:32px;--s-500:40px;--s-600:48px;--s-700:64px;--s-800:80px;--s-900:96px;
  --r-lg:8px;--r-xl:12px;--r-2xl:16px;--r-3xl:24px;--r-full:9999px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.5;overflow-x:hidden;font-feature-settings:"ss01" 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
[hidden]{display:none!important}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{text-wrap:balance}
p,li,dd{text-wrap:pretty}
ul,ol{margin:0;padding:0;list-style:none}
svg{display:block}
.ic{width:1.25rem;height:1.25rem;flex:none}
:focus-visible{outline:2px solid var(--blue-2);outline-offset:3px}

/* Estilos de texto nomeados (B1) */
.heading-1{font-size:3.75rem;line-height:1;font-weight:600;letter-spacing:-.02em}
.heading-2{font-size:3rem;line-height:1;font-weight:600;letter-spacing:-.02em}
.heading-3{font-size:2.25rem;line-height:2.5rem;font-weight:600;letter-spacing:-.015em}
.heading-4{font-size:1.875rem;line-height:2.25rem;font-weight:600;letter-spacing:-.01em}
.heading-5{font-size:1.5rem;line-height:2rem;font-weight:600}
.heading-6{font-size:1.25rem;line-height:1.75rem;font-weight:600}
.title-1{font-size:1.25rem;line-height:1.75rem;font-weight:500}
.title-2{font-size:1.125rem;line-height:1.75rem;font-weight:500}
.title-3{font-size:1rem;line-height:1.5rem;font-weight:500}
.title-4{font-size:.875rem;line-height:1.25rem;font-weight:500}
.body-2{font-size:1rem;line-height:1.5rem;font-weight:500}
.body-3{font-size:1rem;line-height:1.5rem;font-weight:400}
.body-4{font-size:.875rem;line-height:1.25rem;font-weight:600}
.body-6{font-size:.875rem;line-height:1.25rem;font-weight:400}
.button-md{font-size:1rem;line-height:1.5rem;font-weight:600}
.button-sm{font-size:.875rem;line-height:1.25rem;font-weight:600}
.caption-2{font-size:.875rem;line-height:1.25rem;font-weight:400}
.caption-3{font-size:.75rem;line-height:1rem;font-weight:600}
.caption-4{font-size:.75rem;line-height:1rem;font-weight:500}
.caption-5{font-size:.75rem;line-height:1rem;font-weight:400}
/* Em telas estreitas, os títulos descem para o degrau indicado (ainda na escala) */
@media (max-width:767px){
  .heading-1{font-size:1.875rem;line-height:2.25rem}
  .heading-2{font-size:1.875rem;line-height:2.25rem}
  .heading-3{font-size:1.5rem;line-height:2rem}
}
@media (min-width:768px) and (max-width:1023px){
  .heading-1{font-size:3rem;line-height:1}
  .heading-2{font-size:2.25rem;line-height:2.5rem}
}

.skip{position:absolute;left:var(--s-200);top:var(--s-200);z-index:70;background:var(--blue);color:#fff;padding:var(--s-75) var(--s-100);border-radius:var(--r-lg);transform:translateY(-200%);transition:transform .5s var(--ease)}
.skip:focus{transform:translateY(0)}

.wrap{max-width:1140px;margin-inline:auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{color:var(--orange-2)}
.secao{padding-block:var(--s-900)}
.secao-cab{max-width:680px;display:grid;gap:var(--s-200);margin-bottom:var(--s-600)}
.secao-cab p:not(.eyebrow){color:var(--fg-2)}
.banda-2{background:var(--bg-2)}

/* Botões: 8px vertical, 12px horizontal (B2) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-75);padding:var(--s-75) var(--s-100);border-radius:var(--r-lg);text-decoration:none;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background-color .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease),transform .5s var(--ease)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-2)}
.btn-ghost{border-color:var(--line-strong);color:var(--fg);background:transparent}
.btn-ghost:hover{background:rgba(150,160,230,.09)}

/* Navegação flutuante (B7) */
.topo{position:fixed;top:calc(var(--s-200) + env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));z-index:50;display:flex;justify-content:center;pointer-events:none}
.nav-pill{pointer-events:auto;display:flex;align-items:center;gap:var(--s-200);padding:var(--s-75) var(--s-75) var(--s-75) var(--s-200);border-radius:var(--r-full);background:rgba(10,16,40,.72);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);max-width:100%}
.marca{display:flex;align-items:center;gap:var(--s-75);text-decoration:none;color:var(--fg);white-space:nowrap}
.marca svg{width:1.5rem;height:1.5rem;flex:none}
.nav-links{display:flex;align-items:center;gap:var(--s-50)}
.nav-links a{text-decoration:none;color:var(--fg-2);padding:var(--s-75) var(--s-100);border-radius:var(--r-full);transition:color .3s var(--ease),background-color .3s var(--ease)}
.nav-links a:hover{color:var(--fg)}
.nav-links a[aria-current="true"]{color:var(--fg);background:rgba(150,160,230,.1)}
.menu-btn{display:none;width:2.5rem;height:2.5rem;align-items:center;justify-content:center;background:transparent;border:0;border-radius:var(--r-full);color:var(--fg);cursor:pointer;position:relative}
.menu-btn span{position:absolute;left:50%;top:50%;width:1.125rem;height:2px;background:currentColor;border-radius:var(--r-full);transform:translate(-50%,-50%) translateY(-4px);transition:transform .5s var(--ease),opacity .3s var(--ease)}
.menu-btn span:nth-child(2){transform:translate(-50%,-50%) translateY(4px)}
.menu-btn[aria-expanded="true"] span:first-child{transform:translate(-50%,-50%) rotate(45deg)}
.menu-btn[aria-expanded="true"] span:nth-child(2){transform:translate(-50%,-50%) rotate(-45deg)}
.menu-panel{position:fixed;inset:0;z-index:45;background:rgba(6,10,28,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:calc(var(--s-900) + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right, 0px)) var(--s-400) max(16px, env(safe-area-inset-left, 0px));display:none;flex-direction:column;gap:var(--s-75);overflow-y:auto}
.menu-panel.aberto{display:flex}
.menu-panel a{text-decoration:none;color:var(--fg);padding:var(--s-100) var(--s-200);border-radius:var(--r-xl);opacity:0;transform:translateY(var(--s-300));transition:opacity .5s var(--ease),transform .5s var(--ease)}
.menu-panel.aberto a{opacity:1;transform:translateY(0)}
.menu-panel a[aria-current="true"]{background:rgba(150,160,230,.1)}
.menu-panel .btn{margin-top:var(--s-200);justify-content:center}

/* Hero (B5): coluna única, título e subtítulo com 680px no máximo */
.hero{padding-block:calc(var(--s-900) + var(--s-500)) var(--s-900)}
.hero .wrap{display:grid;justify-items:center;text-align:center;gap:var(--s-600)}
.hero-txt{display:grid;justify-items:center;gap:var(--s-300);max-width:680px}
.hero-h1{background:linear-gradient(90deg,#FFFFFF,#9B9B9B);-webkit-background-clip:text;background-clip:text;color:transparent;max-width:680px}
.hero .lead{color:var(--fg-2);max-width:680px}
.hero-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s-75) var(--s-300);color:var(--fg-3)}
.hero-tags li{display:flex;align-items:center;gap:var(--s-75)}
.hero-tags li::before{content:"";width:6px;height:6px;border-radius:var(--r-full);background:var(--orange)}
.hero-prova{color:var(--fg-2)}

.hero-visual{position:relative;width:100%;max-width:820px;aspect-ratio:4/3;min-width:0}
.moldura{position:absolute;inset:0;border-radius:var(--r-3xl);overflow:hidden;border:1px solid var(--line-strong);background:var(--bg-3)}
.moldura img{width:100%;height:100%;object-fit:cover}
.holo{position:absolute;background:rgba(10,16,40,.8);border:1px solid rgba(63,156,233,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:var(--r-xl);padding:var(--s-100);color:var(--fg);text-align:left}
.holo-cab{display:flex;align-items:center;justify-content:space-between;gap:var(--s-75);color:var(--fg-2);margin-bottom:var(--s-75)}
.holo-cab .pill{color:var(--orange-2);border:1px solid rgba(207,103,11,.5);border-radius:var(--r-full);padding:0 var(--s-75);white-space:nowrap}
.holo svg{width:100%;height:auto}
.holo-1{top:6%;right:-3%;width:34%}
.holo-2{bottom:10%;left:-3%;width:32%}
.holo-3{top:58%;right:3%;display:flex;align-items:center;gap:var(--s-75);padding:var(--s-75) var(--s-100);border-radius:var(--r-full)}
.holo-3 .ok{width:1rem;height:1rem;border-radius:var(--r-full);background:var(--orange);display:grid;place-items:center;flex:none;color:#060A1C}
.holo-3 .ok svg{width:.625rem;height:.625rem}

/* Isso parece familiar? */
.cenas{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-300)}
.cena{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r-2xl);padding:var(--s-300);display:grid;gap:var(--s-200);align-content:start;min-width:0}
.cena-icone{width:2.5rem;height:2.5rem;border-radius:var(--r-xl);display:grid;place-items:center;color:var(--orange-2);background:rgba(207,103,11,.12);border:1px solid rgba(207,103,11,.35)}
.cena-antes{color:var(--fg)}
.cena-depois{color:var(--fg-2);display:grid;gap:var(--s-50);padding-top:var(--s-200);border-top:1px solid var(--line)}
.cena-depois span{color:var(--blue-2)}
.familiar-fecho{margin-top:var(--s-500);color:var(--fg);max-width:680px}

/* Benefícios */
.grade-beneficios{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-300)}
.card{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r-2xl);padding:var(--s-300);display:grid;gap:var(--s-200);align-content:start;min-width:0;transition:border-color .3s var(--ease),transform .5s var(--ease)}
.card:hover{border-color:rgba(63,156,233,.45);transform:translateY(-2px)}
.card .icone{width:2.5rem;height:2.5rem;border-radius:var(--r-xl);display:grid;place-items:center;background:rgba(21,125,209,.14);border:1px solid rgba(63,156,233,.35);color:var(--orange-2)}
.card p{color:var(--fg-2)}

.areas{margin-top:var(--s-700);display:grid;gap:var(--s-400)}
.areas-cab{display:grid;gap:var(--s-100);max-width:680px}
.areas-cab p{color:var(--fg-2)}
.grade-2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s-300)}
.area{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r-2xl);overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.area img{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
.area-txt{padding:var(--s-300);display:grid;gap:var(--s-200);align-content:start}
.area-txt h4{display:flex;align-items:center;gap:var(--s-75)}
.area-txt h4 .ic{color:var(--orange-2)}
.area-txt p{color:var(--fg-2)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s-75)}
.chips li{color:var(--fg-2);border:1px solid var(--line-strong);border-radius:var(--r-full);padding:var(--s-50) var(--s-100)}

/* Tagline reveal (B11) */
.tagline{padding-block:var(--s-900)}
.tagline p{max-width:680px;color:var(--fg)}
.tagline .w{display:inline-block;opacity:.3;transition:opacity .5s var(--ease)}
.tagline .w.on{opacity:1}

/* Prova social (oculta até existir conteúdo real) */
.prova-grade{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-300)}
.depo{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r-2xl);padding:var(--s-300);display:grid;gap:var(--s-200)}
.depo footer{color:var(--fg-2)}

/* Como funciona + formulário */
.processo .wrap{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-700);align-items:start}
.processo .secao-cab{grid-column:1/-1;margin-bottom:0}
.etapas{display:grid;gap:var(--s-300)}
.etapa{display:grid;grid-template-columns:2.5rem 1fr;gap:var(--s-200);min-width:0}
.etapa .num{width:2.5rem;height:2.5rem;border-radius:var(--r-xl);display:grid;place-items:center;color:var(--orange-2);background:rgba(207,103,11,.12);border:1px solid rgba(207,103,11,.35)}
.etapa div{display:grid;gap:var(--s-50)}
.etapa p{color:var(--fg-2)}

.form-card{background:var(--bg-3);border:1px solid var(--line-strong);border-radius:var(--r-2xl);padding:var(--s-300);display:grid;gap:var(--s-300);min-width:0;scroll-margin-top:var(--s-900)}
.form-card header{display:grid;gap:var(--s-50)}
.form-intro{color:var(--fg-2)}
.form-card form{display:grid;gap:var(--s-200)}
.campo{display:grid;gap:var(--s-50)}
.campo label{color:var(--fg-2)}
.campo input,.campo textarea{width:100%;font:inherit;color:var(--fg);background:rgba(6,10,28,.7);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:var(--s-75) var(--s-100);transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
.campo textarea{resize:vertical;min-height:112px}
.campo input::placeholder,.campo textarea::placeholder{color:var(--fg-3)}
.campo input:focus,.campo textarea:focus{outline:none;border-color:var(--blue-2);box-shadow:0 0 0 3px rgba(63,156,233,.22)}
.campo .invalido{border-color:var(--orange-2)}
.campo-erro{color:var(--orange-2)}
.form-card .btn{width:100%}
.apos{color:var(--fg-2);text-align:center}
.apos a{color:var(--blue-2)}
.privacidade{color:var(--fg-3);text-align:center}

/* FAQ */
.faq-lista{display:grid;gap:var(--s-100);max-width:760px}
.faq-lista details{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r-2xl);padding:var(--s-200) var(--s-300)}
.faq-lista summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:var(--s-200);color:var(--fg)}
.faq-lista summary::-webkit-details-marker{display:none}
.faq-lista summary .ic{color:var(--orange-2);transition:transform .5s var(--ease)}
.faq-lista details[open] summary .ic{transform:rotate(180deg)}
.faq-lista details p{color:var(--fg-2);padding-top:var(--s-100)}

/* Fechamento: redução de risco + CTA final */
.final{padding-block:var(--s-900)}
.final .wrap{display:grid;gap:var(--s-600)}
.garantias{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-300)}
.garantias li{display:flex;gap:var(--s-100);align-items:flex-start;color:var(--fg-2)}
.garantias .ic{color:var(--orange-2);margin-top:var(--s-25)}
.final-cta{display:grid;gap:var(--s-200);justify-items:center;text-align:center}
.final-cta h2{max-width:680px}
.final-cta p{color:var(--fg-2);max-width:680px}

/* Rodapé */
.rodape{background:var(--bg-2);padding-block:var(--s-700) var(--s-400)}
.rodape .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:var(--s-400) var(--s-700);align-items:start}
.rodape-marca{display:grid;gap:var(--s-200);justify-items:start}
.rodape-marca p{color:var(--fg-2);max-width:420px}
.rodape-contato{display:grid;gap:var(--s-100);justify-items:start}
.rodape-contato a{color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:var(--s-75);transition:color .3s var(--ease)}
.rodape-contato a:hover{color:var(--blue-2)}
.rodape-contato .ic{color:var(--orange-2)}
.rodape-priv{grid-column:1/-1;border:1px solid var(--line);border-radius:var(--r-2xl);padding:var(--s-200) var(--s-300)}
.rodape-priv summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:var(--s-200)}
.rodape-priv summary::-webkit-details-marker{display:none}
.rodape-priv summary .ic{color:var(--orange-2);transition:transform .5s var(--ease)}
.rodape-priv[open] summary .ic{transform:rotate(180deg)}
.rodape-priv p{color:var(--fg-2);padding-top:var(--s-100)}
.rodape-legal{grid-column:1/-1;color:var(--fg-3);display:flex;flex-wrap:wrap;gap:var(--s-75) var(--s-300);justify-content:space-between}

/* Chatbot Levi */
.chat{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:max(16px, env(safe-area-inset-bottom, 0px));z-index:40;display:grid;justify-items:end;gap:var(--s-100)}
.chat-toggle{display:inline-flex;align-items:center;gap:var(--s-75);background:var(--blue);color:#fff;border:0;border-radius:var(--r-full);padding:var(--s-75) var(--s-200) var(--s-75) var(--s-75);cursor:pointer;transition:background-color .3s var(--ease),transform .5s var(--ease)}
.chat-toggle:hover{background:var(--blue-2)}
.chat-toggle:active{transform:scale(.98)}
.chat-toggle-avatar{display:block;width:1.5rem;height:1.5rem;border-radius:var(--r-full);background:var(--bg);flex:none}
.chat-toggle-avatar svg{width:1.5rem;height:1.5rem}
.chat-toggle .fechar{display:none;width:1.5rem;height:1.5rem}
.chat-toggle[aria-expanded="true"] .abrir{display:none}
.chat-toggle[aria-expanded="true"] .fechar{display:block}
.chat-panel{width:min(380px,calc(100vw - 32px));height:min(580px,calc(100dvh - 112px));background:var(--bg-3);border:1px solid var(--line-strong);border-radius:var(--r-2xl);display:grid;grid-template-rows:auto 1fr auto auto;overflow:hidden}
.chat-cab{display:flex;align-items:center;gap:var(--s-100);padding:var(--s-100) var(--s-200);border-bottom:1px solid var(--line);background:var(--bg-2)}
.chat-avatar{width:2.5rem;height:2.5rem;border-radius:var(--r-full);display:grid;place-items:center;background:var(--bg);border:1px solid rgba(63,156,233,.5);flex:none}
.chat-avatar svg{width:2.5rem;height:2.5rem}
.chat-cab .info{min-width:0;flex:1}
.chat-cab .sub{color:var(--fg-2);display:flex;align-items:center;gap:var(--s-50)}
.chat-cab .sub::before{content:"";width:6px;height:6px;border-radius:var(--r-full);background:var(--orange-2)}
.chat-fechar{width:2rem;height:2rem;border-radius:var(--r-lg);border:1px solid var(--line-strong);background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.chat-fechar .ic{width:1rem;height:1rem}
.chat-msgs{overflow-y:auto;padding:var(--s-200);display:flex;flex-direction:column;gap:var(--s-75);min-height:0}
.msg{max-width:88%;padding:var(--s-75) var(--s-100);border-radius:var(--r-xl);white-space:pre-line;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:rgba(63,156,233,.12);border:1px solid rgba(63,156,233,.28)}
.msg.user{align-self:flex-end;background:var(--blue);color:#fff}
.msg-acao{display:inline-flex;align-items:center;gap:var(--s-50);margin-top:var(--s-75);color:#fff;background:var(--blue);padding:var(--s-50) var(--s-75);border-radius:var(--r-lg);text-decoration:none;transition:background-color .3s var(--ease)}
.msg-acao:hover{background:var(--blue-2)}
.digitando{align-self:flex-start;display:flex;gap:var(--s-50);padding:var(--s-100);background:rgba(63,156,233,.12);border:1px solid rgba(63,156,233,.28);border-radius:var(--r-xl)}
.digitando i{width:6px;height:6px;border-radius:var(--r-full);background:var(--fg-2);opacity:.4;animation:pulsar 1s var(--ease) infinite}
.digitando i:nth-child(2){animation-delay:.15s}
.digitando i:nth-child(3){animation-delay:.3s}
@keyframes pulsar{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.chat-chips{display:flex;flex-wrap:wrap;gap:var(--s-50);padding:var(--s-75) var(--s-200) var(--s-100);border-top:1px solid var(--line)}
.chat-chips button{font:inherit;color:var(--fg-2);background:transparent;border:1px solid var(--line-strong);border-radius:var(--r-full);padding:var(--s-50) var(--s-75);cursor:pointer;transition:border-color .3s var(--ease),color .3s var(--ease)}
.chat-chips button:hover{border-color:var(--blue-2);color:var(--fg)}
.chat-rodape{display:grid;gap:var(--s-75);padding:var(--s-100) var(--s-200) calc(var(--s-200) + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--line);background:var(--bg-2)}
.chat-form{display:flex;gap:var(--s-75)}
.chat-form input{flex:1;min-width:0;font:inherit;color:var(--fg);background:rgba(6,10,28,.7);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:var(--s-75) var(--s-100)}
.chat-form input::placeholder{color:var(--fg-3)}
.chat-form input:focus{outline:none;border-color:var(--blue-2);box-shadow:0 0 0 3px rgba(63,156,233,.22)}
.chat-form button{width:2.5rem;height:2.5rem;flex:none;border-radius:var(--r-lg);border:0;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background-color .3s var(--ease)}
.chat-form button:hover{background:var(--blue-2)}
.chat-atendente{display:flex;align-items:center;justify-content:center;gap:var(--s-75);color:var(--fg);text-decoration:none;border:1px solid rgba(207,103,11,.55);background:rgba(207,103,11,.12);border-radius:var(--r-lg);padding:var(--s-75) var(--s-100);transition:background-color .3s var(--ease)}
.chat-atendente:hover{background:rgba(207,103,11,.22)}
.chat-atendente .ic{color:var(--orange-2)}

/* Revelação ao rolar (B7): só é aplicada por script, a elementos abaixo da dobra */
.reveal-pre{opacity:0;transform:translateY(var(--s-400))}
.reveal-in{opacity:1;transform:translateY(0);transition:opacity .7s var(--ease),transform .7s var(--ease)}

/* Responsivo */
@media (max-width:1023px){
  .grade-beneficios{grid-template-columns:repeat(2,1fr)}
  .processo .wrap{grid-template-columns:1fr;gap:var(--s-600)}
}
@media (max-width:899px){
  .nav-links,.nav-cta{display:none}
  .menu-btn{display:inline-flex}
  .nav-pill{gap:var(--s-75)}
}
@media (max-width:767px){
  .secao{padding-block:var(--s-700)}
  .secao-cab{margin-bottom:var(--s-400)}
  .hero{padding-block:calc(var(--s-900) + var(--s-200)) var(--s-700)}
  .hero .wrap{gap:var(--s-400)}
  .cenas,.grade-2,.garantias,.prova-grade{grid-template-columns:1fr}
  .holo{padding:var(--s-75)}
  .holo-1{top:4%;right:2%;width:52%}
  .holo-2{bottom:8%;left:2%;width:48%}
  .holo-3{top:56%;right:4%}
  .tagline,.final{padding-block:var(--s-700)}
  .rodape .wrap{grid-template-columns:1fr}
  .chat-toggle .rotulo-longo{display:none}
  .chat-panel{width:calc(100vw - 32px);height:min(600px,calc(100dvh - 96px))}
}
@media (max-width:479px){
  .grade-beneficios{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .digitando i{animation:none;opacity:.7}
  .reveal-pre{opacity:1;transform:none}
  .reveal-in,.menu-panel a,.btn,.card,.chat-toggle,.menu-btn span{transition:none}
  .menu-panel a{opacity:1;transform:none}
  .tagline .w{opacity:1;transition:none}
}
